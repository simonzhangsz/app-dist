<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTUEver APP 测试分发</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
    }
    .card {
      background: white;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .btn {
      display: block;
      margin: 14px 0;
      padding: 14px 20px;
      background: #0070f3;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn:hover { background: #005bb5; }
    .btn-android { background: #10b981; }
    .btn-android:hover { background: #059669; }
    .tip { font-size: 13px; color: #888; margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0;">WANTUEver 应用测试版</h2>
    <p style="color:#666;">版本: v0.9.2</p>

    <!-- 动态主按钮（通过下方脚本判断设备） -->
    <a id="main-btn" class="btn" href="#">检测设备中...</a>

    <!-- 备用按钮：无论何时测试人员都可以手动选平台 -->
    <div style="margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px;">
      <a id="ios-link" class="btn" style="background:#4b5563; font-size:14px; padding:8px;" href="#">手选：iOS 安装</a>
      <a id="android-link" class="btn btn-android" style="font-size:14px; padding:8px;" href="#">手选：Android 下载</a>
    </div>

    <div class="tip">
      iOS 用户请使用系统自带 <b>Safari 浏览器</b> 打开本页安装。<br>
      安装前请确认手机 UDID 已添加至测试证书中。
    </div>
  </div>

  <script>
    // 1. 替换为你的 GitHub Pages 域名下的 plist 地址
    const plistRawUrl = "https://github.com/simonzhangsz/app-dist/blob/main/manifest.plist";
    const iosInstallUrl = "itms-services://?action=download-manifest&url=" + encodeURIComponent(plistRawUrl);

    // 2. 替换为你的 GitHub Releases APK 直链
    const androidDownloadUrl = "https://github.com/simonzhangsz/app-dist/releases/download/v0.9.2/WANTUEver.apk";

    document.getElementById("ios-link").href = iosInstallUrl;
    document.getElementById("android-link").href = androidDownloadUrl;

    // 自动检测设备
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const mainBtn = document.getElementById("main-btn");

    if (isIOS) {
      mainBtn.innerText = "安装 iOS 版本";
      mainBtn.href = iosInstallUrl;
    } else {
      mainBtn.innerText = "下载 Android 版本";
      mainBtn.className = "btn btn-android";
      mainBtn.href = androidDownloadUrl;
    }
  </script>
</body>
</html>
